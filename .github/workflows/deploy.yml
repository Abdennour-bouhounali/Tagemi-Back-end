name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node & Build Frontend (Vite/React)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use your local node version

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      # 3. Copy Built Assets to VPS (Prevent VPS RAM crash)
      - name: Upload Build Artifacts via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "public/build" # The folder Vite generates
          target: "/var/www/Tagemi-Back-end" # Your project path on VPS

      # 4. Deploy Backend & Run Laravel Commands via SSH
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/Tagemi-Back-end
            
            # Pull latest backend code
            git pull origin main
            
            # Install/Update PHP dependencies
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-dev --optimize-autoloader
            
            # Run Migrations (Force is needed for production)
            php artisan migrate --force
            
            # Clear/Rebuild Caches
            php artisan optimize
            php artisan view:cache
