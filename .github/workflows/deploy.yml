name: Deploy Laravel App to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "$VPS_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
      env:
        VPS_KEY: ${{ secrets.OCTENIUM_KEY }}

    - name: Deploy to VPS
      env:
        OCTENIUM_HOST: ${{ secrets.OCTENIUM_HOST }}
        OCTENIUM_USER: ${{ secrets.OCTENIUM_USER }}
        OCTENIUM_SSH_PORT: ${{ secrets.OCTENIUM_SSH_PORT }}
      run: |
        ssh -o StrictHostKeyChecking=no -p ${OCTENIUM_SSH_PORT:-22} $OCTENIUM_USER@$OCTENIUM_HOST << 'EOF'
          # Stop at the first failing step: a failed fetch/reset/composer must
          # fail the workflow instead of "succeeding" with the old code.
          set -e
          cd /var/www/Tagemi-Back-end

          echo "Fetching latest code..."
          git fetch --all
          git reset --hard origin/main

          echo "Installing PHP dependencies..."
          composer install --no-dev --optimize-autoloader --no-interaction

          echo "Running database migrations..."
          # Requires the one-time database/sql/2026_10_production_mark_legacy_migrations.sql.
          # If a migration fails the site stays in maintenance mode instead of
          # serving code that expects missing columns.
          php artisan down --retry=60 || true
          if php artisan migrate --force; then
            php artisan up
          else
            echo "MIGRATION FAILED: site left in maintenance mode, fix and run 'php artisan migrate --force && php artisan up'"
            exit 1
          fi

          echo "Clearing & optimizing Laravel cache..."
          php artisan cache:clear
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          php artisan optimize

          echo "Setting permissions..."
          chmod -R 775 storage bootstrap/cache || true  # files uploaded by the web server user can't be chmod-ed by deploy

          echo "Restarting services if required..."
          sudo systemctl restart php8.5-fpm || true
          sudo systemctl restart nginx || true

          echo "Deployment completed successfully!"
        EOF
